name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.18', '1.19']
        os: ['ubuntu-latest', 'ubuntu-24.04']

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Go
      uses: actions/setup-go@v5.3.0
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build

    - name: Create-DB
      run: docker compose up -d

    # PASSO NOVO: Aguarda o PostgreSQL ficar pronto
    - name: Wait for Database
      run: sleep 10

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-24.04']
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Build
      run: go build -v main.go
